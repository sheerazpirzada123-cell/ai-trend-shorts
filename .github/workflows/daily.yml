name: Daily AI Trend Shorts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Research trends
        run: |
          python src/trends.py

      - name: Show collected trends
        run: |
          echo "===== TODAY'S TRENDS ====="
          cat trends.json

      - name: Save trends
        uses: actions/upload-artifact@v4
        with:
          name: daily-trends
          path: trends.json
