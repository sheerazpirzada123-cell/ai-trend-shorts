name: Daily AI Trend Shorts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Research trends
        run: |
          python src/trends.py

      - name: Show collected trends
        run: |
          echo "===== TODAY'S TRENDS ====="
          cat trends.json

      - name: AI selects trend and creates video plan
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python src/ai_brain.py

      - name: Show AI video plan
        run: |
          echo "===== AI VIDEO PLAN ====="
          cat video_plan.json

      - name: Generate test AI video
        env:
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
        run: |
          python src/video_generator.py

      - name: Show video job
        run: |
          echo "===== MAGIC HOUR VIDEO JOB ====="
          cat video_job.json

      - name: Save AI video plan
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-plan
          path: video_plan.json

      - name: Save video job
        uses: actions/upload-artifact@v4
        with:
          name: video-job
          path: video_job.json

      - name: Save trends
        uses: actions/upload-artifact@v4
        with:
          name: daily-trends
          path: trends.json
